name: Release
on:
  push:
    tags:
      - "v*" # Se ejecutará cada vez que subas un tag que empiece con 'v' (ej: v1.0.0)
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest] # Aquí le decimos que compile en Windows, Mac y Ubuntu

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      - name: Instalar dependencias de Linux (Solo para Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Instalar dependencias de Node.js
        # Cambia pnpm por npm o yarn dependiendo de lo que uses en tu proyecto
        run: npm install

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cachear Rust para que compile más rápido
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Construir y crear el Release con Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__ # Toma la versión de tu tauri.conf.json
          releaseName: "App v__VERSION__"
          releaseBody: |
  ## EquiPar v__VERSION__

  Descarga el instalador según tu sistema operativo:

  | Sistema | Archivo |
  |---------|---------|
  | 🪟 Windows | `EquiPar_x.x.x_x64-setup.exe` |
  | 🍎 Mac (Apple Silicon) | `EquiPar_x.x.x_aarch64.dmg` |
  | 🐧 Linux | `EquiPar_x.x.x_amd64.AppImage` |

  > **Mac Intel** (más antiguo): usa el archivo `.dmg` con `x64` en el nombre si aparece.
  > **Linux avanzado**: también disponibles `.deb` y `.rpm` más abajo.
          releaseDraft: true
          prerelease: false
