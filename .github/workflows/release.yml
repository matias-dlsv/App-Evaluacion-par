name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar dependencias de Linux (Solo para Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Instalar dependencias de Node.js
        run: npm install

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cachear Rust para que compile más rápido
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Construir y crear el Release con Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: "EquiPar v__VERSION__"
          releaseBody: |
            ## EquiPar v__VERSION__

            Descarga el instalador según tu sistema operativo:

            | Sistema | Archivo |
            |---------|---------|
            | 🪟 Windows | `EquiPar___VERSION___x64-setup.exe` |
            | 🍎 Mac (Apple Silicon) | `EquiPar___VERSION___aarch64.dmg` |
            | 🐧 Linux | `EquiPar___VERSION___amd64.AppImage` |

            > **Mac Intel** (más antiguo): usa el archivo `.dmg` con `x64` en el nombre si aparece.
            > **Linux avanzado**: también disponibles `.deb` y `.rpm` más abajo.
          releaseDraft: true
          prerelease: false
