[package]
name = "equipar"
version = "0.1.0"
description = "App para evaluaciones pares"
authors = ["Universidad de los Andes"]
edition = "2021"
default-run = "equipar"

[lib]
name = "equipar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"         
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2"
calamine = "0.33.0"
tauri-plugin-dialog = "2"
